{% set preview_url = h.url_for('tif_imageview.preview', resource_id=resource.id, _external=True) %}
<img id="tif-preview" src="{{ preview_url }}" alt="TIF Preview" style="max-width: 100%; height: auto;">

<script type="text/javascript">
  // Handle image load errors
  document.getElementById('tif-preview').onerror = function() {
      this.alt = 'Failed to load preview. Please try downloading the file.';
      this.style.border = '1px solid #ccc';
      this.style.padding = '20px';
  };
</script>
